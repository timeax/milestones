name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run check:examples
      - run: npm run check:exports
      - run: npm run check:artifact
      - run: npm run check:package

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: bun x tsc -p tsconfig.json --noEmit
      - run: bun run build
      - run: bun x vitest run
      - run: bun scripts/bun-smoke.mjs
      - run: npm run check:package
